# MT · keep-alive (17.9)
# Een gratis Supabase-project pauzeert na zeven dagen zonder activiteit. Elke dag roept deze
# workflow de pingfunctie op van elk project in config.js, met de publishable key enkel als apikey.
# Dit is de reserve: cron-job.org doet het elke zes uur. GitHub kan een geplande workflow
# uitschakelen na 60 dagen zonder upload; faalt hij, dan krijg je een mail van GitHub.

name: Keep-alive

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Pingfunctie
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: De code ophalen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deno klaarzetten
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.6
      - name: De projecten wakker houden
        run: deno run --allow-read=. --allow-net .github/keepalive.js
